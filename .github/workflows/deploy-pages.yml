name: Deploy website to GitHub Pages

# Builds the site in the cloud (GitHub-hosted Node 22) and publishes the static
# output to GitHub Pages. No Vercel, no local build needed.
#
# One-time setup by a repo admin: Settings → Pages → Build and deployment →
# Source = "GitHub Actions". After that, every push to main redeploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project pages are served under /<repo>/. This feeds vite `base` and the
      # nitro github_pages preset (see vite.config.ts).
      PAGES_BASE: /NSBT_Website/
      # DATABASE_URL is intentionally left UNSET so `npm run build`'s db:migrate
      # step skips (HANDOFF §3). Do not set it, even to an empty string.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The committed package-lock.json (from the Grok export) is out of sync
      # with package.json, so `npm ci` refuses. Use `npm install`, which
      # resolves and reconciles the lockfile, then builds.
      - run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Locate static output
        id: out
        run: |
          DIR=""
          for d in .output/public dist/client dist .output/static build; do
            if [ -f "$d/index.html" ] || [ -f "$d/_shell.html" ]; then DIR="$d"; break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::Could not find a static build output. Tree:"; find . -maxdepth 3 -name '*.html' -not -path './node_modules/*' | head -50; exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Static output: $DIR"; ls -la "$DIR"

      - name: SPA layout + disable Jekyll
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          touch "$DIR/.nojekyll"
          # SPA mode emits _shell.html. GitHub Pages serves index.html at "/" and
          # 404.html for unknown deep links, so point both at the shell — the
          # client router then renders the requested route.
          if [ -f "$DIR/_shell.html" ]; then
            [ -f "$DIR/index.html" ] || cp "$DIR/_shell.html" "$DIR/index.html"
            cp "$DIR/_shell.html" "$DIR/404.html"
          fi
          ls -la "$DIR"/*.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
